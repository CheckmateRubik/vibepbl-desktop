[package]
name = "vibepbl-desktop"
version = "2.0.67"
description = "Offline secretary workspace for medical PBL sessions"
authors = ["CheckmateRubik"]
license = "MIT"
repository = "https://github.com/CheckmateRubik/vibepbl-desktop"
edition = "2021"
rust-version = "1.88"

[lib]
name = "vibepbl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rfd = "0.15"
