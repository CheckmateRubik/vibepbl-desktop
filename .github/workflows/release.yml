name: Build VibePBL Desktop for Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend tooling
        run: npm ci
      - name: Check frontend JavaScript
        run: npm run check:js
      - name: Test fair randomizer
        run: node scripts/test-randomizer.mjs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked

      - name: Build standalone Windows executable
        run: npm run tauri -- build --no-bundle
      - name: Name standalone Windows executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/vibepbl-desktop.exe" "VibePBL.Desktop_${version}_Windows-x64-Portable.exe"
      - name: Store standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: VibePBL.Desktop_*_Windows-x64-Portable.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "VibePBL Desktop ${VERSION}" --notes "Offline VibePBL download: standalone Windows executable."
          else
            gh release create "$TAG" --title "VibePBL Desktop ${VERSION}" --notes "Offline VibePBL download: standalone Windows executable."
          fi
          gh release upload "$TAG" release-assets/* --clobber
