name: Build VibePBL Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend tooling
        run: npm ci
      - name: Check frontend JavaScript
        run: npm run check:js
      - name: Test fair randomizer
        run: node scripts/test-randomizer.mjs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: VibePBL Desktop __VERSION__
          releaseBody: Offline desktop installers for VibePBL Secretary Edition.
          releaseDraft: true
          prerelease: false
